<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dictation Test 1 | Lis n Bliss</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #17212f;
        --muted: #617084;
        --line: #d9e1ea;
        --soft: #f5f8fb;
        --panel: #ffffff;
        --brand: #146c63;
        --brand-dark: #0d4f49;
        --success: #157347;
        --danger: #b42318;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        color: var(--ink);
        background:
          linear-gradient(120deg, rgba(20, 108, 99, 0.08), transparent 36%),
          linear-gradient(300deg, rgba(217, 119, 6, 0.09), transparent 32%),
          var(--soft);
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      button,
      textarea,
      input {
        font: inherit;
      }

      .shell {
        width: min(920px, calc(100% - 40px));
        margin: 0 auto;
        padding-bottom: 44px;
      }

      header {
        padding: 24px 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        font-weight: 800;
      }

      .brand-mark {
        width: 42px;
        height: 42px;
        border-radius: 10px;
        display: grid;
        place-items: center;
        color: #fff;
        background: var(--brand);
        box-shadow: 0 10px 24px rgba(20, 108, 99, 0.22);
      }

      .nav-link,
      .primary-btn {
        min-height: 42px;
        padding: 10px 16px;
        border-radius: 6px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-weight: 900;
      }

      .nav-link {
        border: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.72);
      }

      .primary-btn {
        border: 1px solid var(--brand);
        color: #fff;
        background: var(--brand);
        cursor: pointer;
      }

      .primary-btn:hover:not(:disabled) {
        background: var(--brand-dark);
      }

      .primary-btn:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }

      .test-panel,
      .feedback-panel,
      .result-panel {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        box-shadow: 0 16px 46px rgba(24, 33, 47, 0.08);
      }

      .test-panel {
        padding: clamp(20px, 4vw, 34px);
      }

      .eyebrow {
        margin: 0 0 8px;
        color: var(--brand-dark);
        font-size: 13px;
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }

      h1 {
        margin: 0;
        font-size: clamp(32px, 5vw, 52px);
        line-height: 1;
      }

      .audio-zone {
        margin-top: 26px;
        padding: 18px;
        border: 1px solid rgba(20, 108, 99, 0.18);
        border-radius: 8px;
        display: grid;
        grid-template-columns: auto minmax(0, 1fr) auto;
        gap: 16px;
        align-items: center;
        background: #f3fbf9;
      }

      .icon-btn {
        width: 52px;
        height: 52px;
        border: 0;
        border-radius: 50%;
        display: grid;
        place-items: center;
        color: #fff;
        background: var(--brand);
        cursor: pointer;
      }

      .wave {
        height: 42px;
        display: flex;
        align-items: center;
        gap: 5px;
      }

      .wave span {
        width: 7px;
        border-radius: 999px;
        background: rgba(20, 108, 99, 0.62);
      }

      .wave span:nth-child(1) {
        height: 16px;
      }

      .wave span:nth-child(2) {
        height: 30px;
      }

      .wave span:nth-child(3) {
        height: 22px;
      }

      .wave span:nth-child(4) {
        height: 38px;
      }

      .replay {
        min-height: 42px;
        padding: 10px 14px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #fff;
        color: var(--ink);
        font-weight: 800;
        cursor: pointer;
      }

      .prompt {
        margin: 28px 0 14px;
        color: var(--muted);
        font-size: 16px;
        line-height: 1.6;
      }

      .answer-input {
        width: 100%;
        min-height: 118px;
        padding: 14px 16px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
        color: var(--ink);
        resize: vertical;
      }

      .answer-input:focus {
        border-color: rgba(20, 108, 99, 0.55);
        outline: 3px solid rgba(20, 108, 99, 0.14);
      }

      .actions {
        margin-top: 14px;
        display: flex;
        justify-content: flex-end;
      }

      .feedback-panel,
      .result-panel {
        margin-top: 18px;
        padding: 16px;
      }

      .feedback-panel strong,
      .feedback-panel span {
        display: block;
      }

      .feedback-panel span {
        margin-top: 4px;
        color: var(--muted);
        font-size: 14px;
      }

      .result-panel {
        display: none;
        line-height: 1.8;
      }

      .result-panel.active {
        display: block;
      }

      .result-panel.final {
        border-color: rgba(21, 115, 71, 0.35);
        background: #effaf3;
      }

      .result-panel h2 {
        margin: 0 0 12px;
        font-size: 22px;
      }

      .summary-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }

      .summary-stat {
        padding: 12px;
        border: 1px solid rgba(21, 115, 71, 0.22);
        border-radius: 8px;
        background: #fff;
      }

      .summary-stat span,
      .summary-stat strong {
        display: block;
      }

      .summary-stat span {
        color: var(--muted);
        font-size: 13px;
        font-weight: 800;
      }

      .summary-stat strong {
        margin-top: 4px;
        color: var(--ink);
        font-size: 22px;
      }

      .word {
        padding: 2px 4px;
        border-radius: 4px;
      }

      .word.correct {
        color: var(--success);
        background: #effaf3;
      }

      .word.wrong {
        color: var(--danger);
        background: #fff1ef;
        font-weight: 800;
      }

      @media (max-width: 640px) {
        .shell {
          width: min(100% - 28px, 920px);
        }

        header {
          align-items: flex-start;
          flex-direction: column;
        }

        .audio-zone {
          grid-template-columns: auto minmax(0, 1fr);
        }

        .replay {
          grid-column: 1 / -1;
        }

        .summary-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <header>
        <a class="brand" href="../../index.html" aria-label="Lis n Bliss home">
          <span class="brand-mark" aria-hidden="true">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
              <path
                d="M5 10v4M9 7v10M13 4v16M17 8v8M21 11v2"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
              />
            </svg>
          </span>
          <span>Lis n Bliss</span>
        </a>

        <a class="nav-link" href="../../dictation.html">Back to tests</a>
      </header>

      <main class="test-panel" aria-label="Dictation test question">
        <p class="eyebrow" id="levelLabel">Easy level - Test 1</p>
        <h1 id="testTitle">Word-by-word dictation</h1>

        <div class="audio-zone">
          <button class="icon-btn" type="button" aria-label="Play audio">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
              <path d="M8 5v14l11-7L8 5Z" fill="currentColor" />
            </svg>
          </button>
          <div class="wave" aria-hidden="true">
            <span></span><span></span><span></span><span></span>
          </div>
          <button class="replay" type="button">Replay audio</button>
        </div>

        <p class="prompt" id="promptText">Type the word you hear.</p>
        <textarea class="answer-input" id="answerInput" aria-label="Dictation answer"></textarea>

        <div class="actions">
          <button class="primary-btn" type="button" id="checkButton">Check answer</button>
        </div>

        <div class="feedback-panel" aria-live="polite">
          <strong id="feedbackTitle">Ready to type</strong>
          <span id="feedbackText">Listen to the audio, then type your answer.</span>
        </div>

        <div class="result-panel" id="resultPanel" aria-label="Answer comparison"></div>
      </main>
    </div>

    <script>
      const tests = {
        easy: {
          label: "Easy level - Test 1",
          title: "Word-by-word dictation",
          prompt: "Type the word you hear.",
          answer: "morning",
          ready: "Listen to the word, then type it exactly.",
          complete: "Correct. The word matches the audio.",
        },
        medium: {
          label: "Medium level - Test 1",
          title: "Information gap dictation",
          prompt: "Fill in the missing phrase: The meeting starts at ____.",
          answer: "half past nine",
          ready: "Listen for the missing time phrase and type only that phrase.",
          complete: "Correct. The missing phrase is accurate.",
        },
        hard: {
          label: "Hard level - Test 1",
          title: "Full-speed dictation",
          prompt: "Type the full sentence from the conversation audio.",
          answer: "I thought the presentation was clear and practical",
          ready: "Type the full sentence. Wrong words will be highlighted in red until the sentence is accurate.",
          complete: "Correct. The full sentence is accurate.",
        },
      };

      const params = new URLSearchParams(window.location.search);
      const level = tests[params.get("level")] ? params.get("level") : "easy";
      const test = tests[level];
      const answerInput = document.querySelector("#answerInput");
      const checkButton = document.querySelector("#checkButton");
      const feedbackTitle = document.querySelector("#feedbackTitle");
      const feedbackText = document.querySelector("#feedbackText");
      const resultPanel = document.querySelector("#resultPanel");
      let attemptCount = 0;

      document.querySelector("#levelLabel").textContent = test.label;
      document.querySelector("#testTitle").textContent = test.title;
      document.querySelector("#promptText").textContent = test.prompt;
      feedbackText.textContent = test.ready;

      function normalize(value) {
        return value
          .trim()
          .toLowerCase()
          .replace(/[.,!?]/g, "")
          .replace(/\s+/g, " ");
      }

      function renderHardComparison(userAnswer) {
        const expectedWords = normalize(test.answer).split(" ");
        const userWords = normalize(userAnswer).split(" ");

        resultPanel.classList.remove("final");
        resultPanel.innerHTML = expectedWords
          .map((word, index) => {
            const className = userWords[index] === word ? "correct" : "wrong";
            return `<span class="word ${className}">${word}</span>`;
          })
          .join(" ");
        resultPanel.classList.add("active");
      }

      function showFinalResult() {
        resultPanel.classList.add("active", "final");
        resultPanel.innerHTML = `
          <h2>Final Result</h2>
          <div class="summary-grid">
            <div class="summary-stat">
              <span>Completed correctly</span>
              <strong>1 / 1</strong>
            </div>
            <div class="summary-stat">
              <span>Attempts used</span>
              <strong>${attemptCount}</strong>
            </div>
          </div>
        `;
        resultPanel.scrollIntoView({ behavior: "smooth", block: "nearest" });
      }

      checkButton.addEventListener("click", () => {
        attemptCount += 1;
        const userAnswer = answerInput.value;
        const isCorrect = normalize(userAnswer) === normalize(test.answer);

        if (isCorrect) {
          feedbackTitle.textContent = "Correct";
          feedbackText.textContent = test.complete;
          showFinalResult();
          answerInput.disabled = true;
          checkButton.disabled = true;
          return;
        }

        feedbackTitle.textContent = "Try again";
        feedbackText.textContent =
          level === "hard"
            ? "Red words need another attempt before this test is complete."
            : "Listen again and correct your dictation.";

        if (level === "hard") {
          renderHardComparison(userAnswer);
        } else {
          resultPanel.classList.remove("active", "final");
          resultPanel.innerHTML = "";
        }
      });
    </script>
  </body>
</html>
