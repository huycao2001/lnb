<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dictation Test 1 | Lis n Bliss</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #17212f;
        --muted: #617084;
        --line: #d9e1ea;
        --soft: #f5f8fb;
        --panel: #ffffff;
        --brand: #146c63;
        --brand-dark: #0d4f49;
        --success: #157347;
        --danger: #b42318;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        color: var(--ink);
        background:
          linear-gradient(120deg, rgba(20, 108, 99, 0.08), transparent 36%),
          linear-gradient(300deg, rgba(217, 119, 6, 0.09), transparent 32%),
          var(--soft);
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      button,
      textarea,
      input {
        font: inherit;
      }

      .shell {
        width: min(920px, calc(100% - 40px));
        margin: 0 auto;
        padding-bottom: 44px;
      }

      header {
        padding: 24px 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        font-weight: 800;
      }

      .brand-mark {
        width: 42px;
        height: 42px;
        border-radius: 10px;
        display: grid;
        place-items: center;
        color: #fff;
        background: var(--brand);
        box-shadow: 0 10px 24px rgba(20, 108, 99, 0.22);
      }

      .nav-link,
      .primary-btn {
        min-height: 42px;
        padding: 10px 16px;
        border-radius: 6px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-weight: 900;
      }

      .nav-link {
        border: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.72);
      }

      .primary-btn {
        border: 1px solid var(--brand);
        color: #fff;
        background: var(--brand);
        cursor: pointer;
      }

      .primary-btn:hover:not(:disabled) {
        background: var(--brand-dark);
      }

      .primary-btn:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }

      .test-panel,
      .feedback-panel,
      .result-panel {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        box-shadow: 0 16px 46px rgba(24, 33, 47, 0.08);
      }

      .test-panel {
        padding: clamp(20px, 4vw, 34px);
      }

      .eyebrow {
        margin: 0 0 8px;
        color: var(--brand-dark);
        font-size: 13px;
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }

      h1 {
        margin: 0;
        font-size: clamp(32px, 5vw, 52px);
        line-height: 1;
      }

      .progress {
        margin-top: 12px;
        color: var(--muted);
        font-size: 15px;
        font-weight: 700;
      }

      .audio-zone {
        margin-top: 26px;
        padding: 18px;
        border: 1px solid rgba(20, 108, 99, 0.18);
        border-radius: 8px;
        display: grid;
        grid-template-columns: auto minmax(0, 1fr) auto;
        gap: 16px;
        align-items: center;
        background: #f3fbf9;
      }

      .icon-btn {
        width: 52px;
        height: 52px;
        border: 0;
        border-radius: 50%;
        display: grid;
        place-items: center;
        color: #fff;
        background: var(--brand);
        cursor: pointer;
      }

      .wave {
        height: 42px;
        display: flex;
        align-items: center;
        gap: 5px;
      }

      .wave span {
        width: 7px;
        border-radius: 999px;
        background: rgba(20, 108, 99, 0.62);
      }

      .wave.playing span:nth-child(1) {
        animation: pulse 0.55s ease-in-out infinite alternate;
      }

      .wave.playing span:nth-child(2) {
        animation: pulse 0.55s ease-in-out 0.1s infinite alternate;
      }

      .wave.playing span:nth-child(3) {
        animation: pulse 0.55s ease-in-out 0.2s infinite alternate;
      }

      .wave.playing span:nth-child(4) {
        animation: pulse 0.55s ease-in-out 0.3s infinite alternate;
      }

      @keyframes pulse {
        from {
          height: 14px;
        }
        to {
          height: 38px;
        }
      }

      .wave span:nth-child(1) {
        height: 16px;
      }

      .wave span:nth-child(2) {
        height: 30px;
      }

      .wave span:nth-child(3) {
        height: 22px;
      }

      .wave span:nth-child(4) {
        height: 38px;
      }

      .replay {
        min-height: 42px;
        padding: 10px 14px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #fff;
        color: var(--ink);
        font-weight: 800;
        cursor: pointer;
      }

      .prompt {
        margin: 28px 0 14px;
        color: var(--muted);
        font-size: 16px;
        line-height: 1.6;
      }

      .answer-input {
        width: 100%;
        min-height: 118px;
        padding: 14px 16px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
        color: var(--ink);
        resize: vertical;
      }

      .answer-input:focus {
        border-color: rgba(20, 108, 99, 0.55);
        outline: 3px solid rgba(20, 108, 99, 0.14);
      }

      .actions {
        margin-top: 14px;
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        justify-content: flex-end;
      }

      .actions[hidden] {
        display: none;
      }

      .feedback-panel,
      .result-panel {
        margin-top: 18px;
        padding: 16px;
      }

      .feedback-panel strong,
      .feedback-panel span {
        display: block;
      }

      .feedback-panel span {
        margin-top: 4px;
        color: var(--muted);
        font-size: 14px;
      }

      .result-panel {
        display: none;
        line-height: 1.8;
      }

      .result-panel.active {
        display: block;
      }

      .result-panel.final {
        border-color: rgba(21, 115, 71, 0.35);
        background: #effaf3;
      }

      .result-panel.correct {
        border-color: rgba(21, 115, 71, 0.45);
        background: #effaf3;
        color: var(--success);
      }

      .result-panel h2 {
        margin: 0 0 12px;
        font-size: 22px;
      }

      .summary-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }

      .summary-stat {
        padding: 12px;
        border: 1px solid rgba(21, 115, 71, 0.22);
        border-radius: 8px;
        background: #fff;
      }

      .summary-stat span,
      .summary-stat strong {
        display: block;
      }

      .summary-stat span {
        color: var(--muted);
        font-size: 13px;
        font-weight: 800;
      }

      .summary-stat strong {
        margin-top: 4px;
        color: var(--ink);
        font-size: 22px;
      }

      .answer-key {
        margin-top: 20px;
        padding-top: 16px;
        border-top: 1px solid rgba(21, 115, 71, 0.22);
      }

      .answer-key h3 {
        margin: 0 0 12px;
        font-size: 18px;
      }

      .review-row {
        padding: 12px 0;
        border-top: 1px solid var(--line);
      }

      .review-row:first-of-type {
        border-top: 0;
        padding-top: 0;
      }

      .review-row .question-label {
        display: block;
        font-weight: 800;
        color: var(--ink);
        margin-bottom: 6px;
      }

      .review-row .your-answer {
        display: block;
        color: var(--muted);
        margin-bottom: 4px;
      }

      .review-row .correct-answer {
        display: block;
        color: var(--success);
        font-weight: 800;
      }

      .word {
        padding: 2px 4px;
        border-radius: 4px;
      }

      .word.correct {
        color: var(--success);
        background: #effaf3;
      }

      .word.wrong {
        color: var(--danger);
        background: #fff1ef;
        font-weight: 800;
      }

      @media (max-width: 640px) {
        .shell {
          width: min(100% - 28px, 920px);
        }

        header {
          align-items: flex-start;
          flex-direction: column;
        }

        .audio-zone {
          grid-template-columns: auto minmax(0, 1fr);
        }

        .replay {
          grid-column: 1 / -1;
        }

        .summary-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <header>
        <a class="brand" href="../../index.html" aria-label="Lis n Bliss home">
          <span class="brand-mark" aria-hidden="true">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
              <path
                d="M5 10v4M9 7v10M13 4v16M17 8v8M21 11v2"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
              />
            </svg>
          </span>
          <span>Lis n Bliss</span>
        </a>

        <a class="nav-link" href="../">Back to tests</a>
      </header>

      <main class="test-panel" aria-label="Dictation test question">
        <p class="eyebrow" id="levelLabel">Easy level - Test 1</p>
        <h1 id="testTitle">Word-by-word dictation</h1>
        <p class="progress" id="progressText">Question 1 of 1</p>

        <div class="audio-zone">
          <button class="icon-btn" type="button" id="playButton" aria-label="Play audio">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
              <path d="M8 5v14l11-7L8 5Z" fill="currentColor" />
            </svg>
          </button>
          <div class="wave" id="wave" aria-hidden="true">
            <span></span><span></span><span></span><span></span>
          </div>
          <button class="replay" type="button" id="replayButton">Replay audio</button>
        </div>

        <p class="prompt" id="promptText">Type the word you hear.</p>
        <textarea
          class="answer-input"
          id="answerInput"
          aria-label="Dictation answer"
          placeholder="Type your answer here"
        ></textarea>

        <div class="actions" id="questionActions">
          <button class="primary-btn" type="button" id="prevButton" disabled>
            Previous question
          </button>
          <button class="primary-btn" type="button" id="checkButton">Check answer</button>
          <button class="primary-btn" type="button" id="nextButton">
            Next question
          </button>
          <button class="primary-btn" type="button" id="submitTestButton">
            Submit test
          </button>
        </div>

        <div class="actions" id="submittedActions" hidden>
          <a class="primary-btn" href="../../dictation.html">Back to tests</a>
        </div>

        <div class="feedback-panel" aria-live="polite">
          <strong id="feedbackTitle">Ready to type</strong>
          <span id="feedbackText">Listen to the audio, then type your answer.</span>
        </div>

        <div class="result-panel" id="resultPanel" aria-label="Answer comparison"></div>
      </main>
    </div>

    <audio id="questionAudio" preload="metadata" playsinline></audio>

    <script src="../../js/site.js"></script>
    <script>
      const AUDIO_DIRS = {
        easy: "audio/Dictation/Easy (A1-A2)",
        medium: "audio/Dictation/Medium (B1-B2)",
        hard: "audio/Dictation/Hard (C1)",
      };

      const tests = {
        easy: {
          label: "Easy level - Test 1",
          title: "Easy word dictation",
          questions: [
            {
              prompt: "Listen to the talk and type the word that you hear.",
              audio: "easy 1.mp3",
              answer: "Sophia",
            },
            {
              prompt: "Listen to the talk and type the word that you hear.",
              audio: "easy 2.mp3",
              answer: "7044",
            },
            {
              prompt: "Listen to the talk and type the word that you hear.",
              audio: "easy 3.mp3",
              answer: "phenomenon",
            },
          ],
          ready: "Listen to the audio, then type the word you hear.",
          complete: "Correct. The word matches the audio.",
        },
        medium: {
          label: "Medium level - Test 1",
          title: "Information gap dictation",
          questions: [
            {
              prompt: "The winter finally ___________________.",
              audio: "dict med1.mp3",
              answer: "stopped",
            },
            {
              prompt: "I kill ___________________.",
              audio: "dict med2.mp3",
              answer: "the weeds in my garden",
            },
            {
              prompt: "The Bright family ___________________.",
              audio: "dict med3.mp3",
              answer: "had a campfire on Friday",
            },
          ],
          ready: "Listen to the audio, then type the missing word or phrase.",
          complete: "Correct. The missing phrase is accurate.",
        },
        hard: {
          label: "Hard level - Test 1",
          title: "Full-speed dictation",
          questions: [
            {
              prompt: "Type thee sentence you hear:___________________",
              audio: "dictation C1.mp3",
              answer: "Exhausted from his swim, the bear must regain his strength."
            }
          ],
          prompt: "Type the full sentence from the conversation audio.",
          answer: "I thought the presentation was clear and practical",
          ready: "Type the full sentence. Wrong words will be highlighted in red until the sentence is accurate.",
          complete: "Correct. The full sentence is accurate.",
        },
      };

      const params = new URLSearchParams(window.location.search);
      if (!params.has("level")) {
        params.set("level", "easy");
        window.history.replaceState(
          null,
          "",
          `${window.location.pathname}?${params.toString()}${window.location.hash}`
        );
      }
      if (params.has("level") && !tests[params.get("level")]) {
        params.set("level", "easy");
        window.history.replaceState(
          null,
          "",
          `${window.location.pathname}?${params.toString()}${window.location.hash}`
        );
      }
      const level = params.get("level");
      const test = tests[level];
      const questionActions = document.querySelector("#questionActions");
      const submittedActions = document.querySelector("#submittedActions");
      const answerInput = document.querySelector("#answerInput");
      const checkButton = document.querySelector("#checkButton");
      const prevButton = document.querySelector("#prevButton");
      const nextButton = document.querySelector("#nextButton");
      const submitTestButton = document.querySelector("#submitTestButton");
      const feedbackTitle = document.querySelector("#feedbackTitle");
      const feedbackText = document.querySelector("#feedbackText");
      const resultPanel = document.querySelector("#resultPanel");
      const progressText = document.querySelector("#progressText");
      const playButton = document.querySelector("#playButton");
      const replayButton = document.querySelector("#replayButton");
      const questionAudio = document.querySelector("#questionAudio");
      const wave = document.querySelector("#wave");
      const questions = test.questions || [
        {
          prompt: test.prompt,
          audio: test.audio,
          answer: test.answer,
        },
      ];
      let activeQuestion = 0;
      let attemptCount = 0;
      const userAnswers = Array(questions.length).fill("");
      const completedQuestions = Array(questions.length).fill(false);

      document.querySelector("#levelLabel").textContent = test.label;
      document.querySelector("#testTitle").textContent = test.title;
      feedbackText.textContent = test.ready;

      function normalize(value) {
        return value
          .trim()
          .toLowerCase()
          .replace(/[.,!?]/g, "")
          .replace(/\s+/g, " ");
      }

      function resolveAudioUrl(filename) {
        const base = AUDIO_DIRS[level] || AUDIO_DIRS.easy;
        const siteBase = LnbSite.getSiteBasePath();
        return `${siteBase}/${LnbSite.encodePath(base)}/${encodeURIComponent(filename)}`;
      }

      function setAudioSource(filename) {
        const url = resolveAudioUrl(filename);
        if (questionAudio.dataset.src === url) {
          return;
        }
        questionAudio.pause();
        questionAudio.dataset.src = url;
        questionAudio.src = url;
        questionAudio.load();
      }

      async function playCurrentAudio() {
        const question = questions[activeQuestion];
        if (!question.audio) {
          feedbackTitle.textContent = "Audio not available";
          feedbackText.textContent = "Audio is not configured for this item yet.";
          return;
        }

        try {
          setAudioSource(question.audio);
          questionAudio.currentTime = 0;
          await questionAudio.play();
          feedbackTitle.textContent = "Playing audio";
          feedbackText.textContent = "Listen carefully, then type the word you hear.";
        } catch (error) {
          feedbackTitle.textContent = "Audio could not play";
          feedbackText.textContent = `Could not play ${question.audio}. Check that the file exists at ${resolveAudioUrl(question.audio)}.`;
        }
      }

      function setWavePlaying(isPlaying) {
        wave.classList.toggle("playing", isPlaying);
      }

      questionAudio.addEventListener("play", () => setWavePlaying(true));
      questionAudio.addEventListener("pause", () => setWavePlaying(false));
      questionAudio.addEventListener("ended", () => setWavePlaying(false));

      playButton.addEventListener("click", playCurrentAudio);
      replayButton.addEventListener("click", playCurrentAudio);

      function renderQuestion() {
        const question = questions[activeQuestion];
        document.querySelector("#promptText").textContent = question.prompt;
        progressText.textContent = `Question ${activeQuestion + 1} of ${questions.length}`;
        answerInput.value = userAnswers[activeQuestion];
        answerInput.disabled = false;
        checkButton.disabled = false;
        checkButton.textContent = "Check answer";
        prevButton.disabled = activeQuestion === 0;
        nextButton.disabled = activeQuestion === questions.length - 1;

        if (completedQuestions[activeQuestion]) {
          feedbackTitle.textContent = "Correct";
          feedbackText.textContent =
            activeQuestion === questions.length - 1
              ? test.complete
              : "Correct. Use Previous question or Next question to keep reviewing.";
          showCorrectPanel(question, false);
        } else {
          feedbackTitle.textContent = "Ready to type";
          feedbackText.textContent = test.ready;
          resultPanel.classList.remove("active", "final", "correct");
          resultPanel.innerHTML = "";
        }

        if (question.audio) {
          setAudioSource(question.audio);
        } else {
          questionAudio.removeAttribute("src");
          delete questionAudio.dataset.src;
        }
      }

      function renderHardComparison(userAnswer) {
        const expectedWords = normalize(questions[activeQuestion].answer).split(" ");
        const userWords = normalize(userAnswer).split(" ");

        resultPanel.classList.remove("final");
        resultPanel.innerHTML = expectedWords
          .map((word, index) => {
            const className = userWords[index] === word ? "correct" : "wrong";
            return `<span class="word ${className}">${word}</span>`;
          })
          .join(" ");
        resultPanel.classList.add("active");
      }

      function showFinalResult() {
        userAnswers[activeQuestion] = answerInput.value;
        const completedTotal = questions.filter((question, index) => {
          return normalize(userAnswers[index]) === normalize(question.answer);
        }).length;
        const unansweredTotal = userAnswers.filter((answer) => normalize(answer) === "").length;
        const reviewTotal = questions.length - completedTotal - unansweredTotal;
        resultPanel.classList.remove("correct");
        resultPanel.classList.add("active", "final");
        resultPanel.innerHTML = `
          <h2>Test Summary</h2>
          <div class="summary-grid">
            <div class="summary-stat">
              <span>Correct answers</span>
              <strong>${completedTotal} / ${questions.length}</strong>
            </div>
            <div class="summary-stat">
              <span>Attempts used</span>
              <strong>${attemptCount}</strong>
            </div>
            <div class="summary-stat">
              <span>Unanswered</span>
              <strong>${unansweredTotal}</strong>
            </div>
            <div class="summary-stat">
              <span>Needs review</span>
              <strong>${reviewTotal}</strong>
            </div>
          </div>
          <div class="answer-key">
            <h3>Answer key</h3>
            ${questions
              .map((question, index) => {
                const userAnswer = userAnswers[index].trim() || "(blank)";
                const isCorrect =
                  normalize(userAnswers[index]) === normalize(question.answer);
                return `
                  <div class="review-row">
                    <span class="question-label">Question ${index + 1}</span>
                    <span class="your-answer">Your answer: ${userAnswer}</span>
                    <span class="correct-answer">Correct answer: ${question.answer}</span>
                    <span class="your-answer">${isCorrect ? "Status: Correct" : "Status: Incorrect"}</span>
                  </div>
                `;
              })
              .join("")}
          </div>
        `;
        resultPanel.scrollIntoView({ behavior: "smooth", block: "nearest" });
      }

      function lockSubmittedState() {
        questionAudio.pause();
        answerInput.disabled = true;
        playButton.disabled = true;
        replayButton.disabled = true;
        questionActions.hidden = true;
        submittedActions.hidden = false;
      }

      function showCorrectPanel(question, scrollIntoView = true) {
        resultPanel.classList.remove("final");
        resultPanel.classList.add("active", "correct");
        resultPanel.innerHTML = `
          <strong>Correct</strong>
          <span>Your answer matches the audio: ${question.answer}</span>
        `;
        if (scrollIntoView) {
          resultPanel.scrollIntoView({ behavior: "smooth", block: "nearest" });
        }
      }

      checkButton.addEventListener("click", () => {
        const question = questions[activeQuestion];
        attemptCount += 1;
        const userAnswer = answerInput.value;
        userAnswers[activeQuestion] = userAnswer;
        const isCorrect = normalize(userAnswer) === normalize(question.answer);

        if (isCorrect) {
          completedQuestions[activeQuestion] = true;
          feedbackTitle.textContent = "Correct";
          showCorrectPanel(question);
          if (completedQuestions.every(Boolean)) {
            feedbackText.textContent = test.complete;
            showFinalResult();
          } else {
            feedbackText.textContent =
              "Correct. Use Previous question or Next question to keep reviewing.";
          }
          return;
        }

        feedbackTitle.textContent = "Try again";
        feedbackText.textContent =
          level === "hard"
            ? "Red words need another attempt before this test is complete."
            : "Listen again and correct your dictation.";

        if (level === "hard") {
          renderHardComparison(userAnswer);
        } else {
          resultPanel.classList.remove("active", "final", "correct");
          resultPanel.innerHTML = "";
        }
      });

      answerInput.addEventListener("input", () => {
        userAnswers[activeQuestion] = answerInput.value;
      });

      prevButton.addEventListener("click", () => {
        if (activeQuestion <= 0) return;
        activeQuestion -= 1;
        renderQuestion();
      });

      nextButton.addEventListener("click", () => {
        if (activeQuestion >= questions.length - 1) return;
        activeQuestion += 1;
        renderQuestion();
      });

      submitTestButton.addEventListener("click", () => {
        userAnswers[activeQuestion] = answerInput.value;
        completedQuestions.forEach((_, index) => {
          completedQuestions[index] =
            normalize(userAnswers[index]) === normalize(questions[index].answer);
        });
        feedbackTitle.textContent = "Test submitted";
        feedbackText.textContent =
          "Your current answers have been submitted, including blank responses.";
        showFinalResult();
        lockSubmittedState();
      });

      renderQuestion();
    </script>
  </body>
</html>
