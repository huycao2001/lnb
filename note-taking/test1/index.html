<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Redirecting | Note-taking Test 1</title>
    <script>
      const params = new URLSearchParams(window.location.search);
      const level = params.get("level") || "easy";
      location.replace(`/note-taking?level=${level}`);
    </script>
  </head>
  <body>
    <p><a id="link" href="/note-taking?level=easy">Continue to Note-taking Test 1</a></p>
  </body>
</html>
